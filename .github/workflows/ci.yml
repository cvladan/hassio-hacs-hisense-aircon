name: Validate integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: pip install homeassistant==2026.9.1 dataclasses-json==0.6.7 getmac==0.9.5 pycryptodome==3.23.0
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Check Python and JSON files
        run: |
          python -m compileall -q custom_components
          python - <<'PY'
          import importlib
          import json
          from pathlib import Path
          root = Path('custom_components/hisense_aircon')
          for path in root.glob('*.py'):
              importlib.import_module(f'custom_components.hisense_aircon.{path.stem}')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          PY
